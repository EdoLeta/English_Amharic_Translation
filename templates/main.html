<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English → Amharic Translator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <header>
    <div class="container">
      <div id="brandname">English → Amharic Translator</div>
      <h2>Neural Machine Translation</h2>
    </div>
  </header>

  <main class="container">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <div class="card">
      <h3>Translate English to Amharic (አማርኛ)</h3>
      <form action="/translate" method="POST">
        <label for="input_text">English sentence:</label>
        <textarea
          id="input_text"
          name="input_text"
          rows="4"
          placeholder="Enter your English text here…"
        ></textarea>
        <button type="submit" class="btn-primary">Translate →</button>
      </form>
    </div>
  </main>
</body>
</html>
